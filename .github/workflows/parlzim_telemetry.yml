name: Automated ParlZim Telemetry Ingestion

on:
  schedule:
    - cron: '0 6 * * *' # Runs every day at 06:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        env:
          LOG_LEVEL: info
        ports:
          - 8191:8191

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 curl-cffi scikit-learn numpy pypdf

      - name: Run Scraper Script
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          FLARESOLVERR_URL: ${{ secrets.FLARESOLVERR_URL || 'http://localhost:8191/v1' }}
        run: |
          python scripts/update_telemetry.py

      - name: Commit and Push Cache
        run: |
          git config --global user.name "KUVHURA Bot"
          git config --global user.email "bot@kuvhura.org"
          git add telemetry_cache.json
          git diff --cached --quiet || (git commit -m "chore: automated daily ParlZim telemetry cache update" && git push)
