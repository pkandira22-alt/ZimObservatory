name: KUVHURA Live Social Telemetry Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-telemetry-sync
  cancel-in-progress: false

jobs:
  sync-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish social telemetry
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          GOOGLE_SHEETS_WEB_APP_TOKEN: ${{ secrets.GOOGLE_SHEETS_WEB_APP_TOKEN }}
        run: python kuvhura_social_telemetry_pipeline.py
