<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#072B13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#072B13"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#0B111E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="36" fill="url(#bg)"/>
  <rect x="3" y="3" width="186" height="186" rx="33" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>

  <!-- Top Ribbon -->
  <rect x="24" y="16" width="144" height="4" rx="2" fill="url(#accent)"/>

  <!-- Observatory Radar Circles -->
  <circle cx="96" cy="98" r="54" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="3,3" opacity="0.25"/>
  <circle cx="96" cy="98" r="38" fill="none" stroke="#22C55E" stroke-width="1" stroke-dasharray="2,2" opacity="0.35"/>
  <circle cx="96" cy="98" r="22" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.3"/>

  <!-- Central Crest: Stylized K chevron & observatory star -->
  <path d="M 64 62 L 78 62 L 78 134 L 64 134 Z" fill="url(#gold)"/>
  <path d="M 78 98 L 118 62 L 136 62 L 96 98 Z" fill="url(#gold)"/>
  <path d="M 96 98 L 136 134 L 118 134 L 78 98 Z" fill="url(#gold)"/>

  <!-- Telemetry Beacon Point -->
  <circle cx="96" cy="98" r="5" fill="#22C55E"/>
  <circle cx="96" cy="98" r="8" fill="none" stroke="#86EFAC" stroke-width="1.5" opacity="0.8"/>

  <!-- Subtitle -->
  <text x="96" y="160" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="12" letter-spacing="3">KUVHURA</text>
  <text x="96" y="174" text-anchor="middle" fill="#D4AF37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="8" letter-spacing="1.5">OBSERVATORY</text>
</svg>
