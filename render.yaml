services:
  - type: web
    name: zimobservatory-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.0
      - key: ALLOWED_ORIGINS
        value: https://pkandira22-alt.github.io
      - key: TIMELINE_STORAGE_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CARTO_MAPS_API_KEY
        sync: false
    disk:
      name: timeline-storage
      mountPath: /var/data
      sizeGB: 1
  - type: web
    name: zimobservatory-forecast
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python stream_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: YOUTUBE_API_KEY
        sync: false
