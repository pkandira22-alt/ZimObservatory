services:
  - type: web
    name: zimobservatory-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://pkandira22-alt.github.io
      - key: GEMINI_API_KEY
        sync: false
  - type: web
    name: zimobservatory-forecast
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python stream_server.py
    healthCheckPath: /health
